<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1520" viewBox="0 0 1080 1520" role="img" aria-labelledby="title desc">
  <title id="title">产品标准审核与发布流程</title>
  <desc id="desc">新增或修改草稿，选择一位审核人提交。指定审核人核对后通过或驳回。通过后标准生效并在企业微信群发布完整内容、艾特所有人。驳回后修改并重新提交。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.8"/></marker><marker id="return" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#b7791f" stroke-width="1.8"/></marker></defs>
  <rect width="1080" height="1520" fill="#ffffff"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="64" y="92" font-size="52" font-weight="600" fill="#1f2937">产品标准审核与发布</text>
    <text x="66" y="143" font-size="27" fill="#64748b">提交人员填写 · 指定人员审核 · 发布后按标准执行</text>
    <g fill="#f8fafc" stroke="#dbe2ea" stroke-width="2">
      <rect x="64" y="196" width="672" height="132" rx="14"/>
      <rect x="64" y="390" width="672" height="142" rx="14"/>
      <rect x="64" y="594" width="672" height="170" rx="14"/>
    </g>
    <g font-size="33" font-weight="600" fill="#334155">
      <text x="94" y="248">1  新增或修改产品标准</text>
      <text x="94" y="443">2  选择一位审核人并提交</text>
      <text x="94" y="647">3  指定审核人核对标准</text>
    </g>
    <g font-size="26" fill="#64748b">
      <text x="94" y="294">填写完整参数，先保存草稿</text>
      <text x="94" y="490">不能选择自己；待审内容尚未生效</text>
      <text x="94" y="691">点击列表中的「审核」按钮</text>
      <text x="94" y="730">核对完整参数与变更，选择通过或驳回</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
      <path d="M400 330V374"/><path d="M400 534V578"/><path d="M400 766V842"/><path d="M400 1010V1064"/>
    </g>
    <text x="420" y="815" font-size="26" fill="#1677ff">通过</text>
    <rect x="64" y="858" width="672" height="150" rx="14" fill="#eff6ff" stroke="#bfd5ef" stroke-width="2"/>
    <text x="94" y="915" font-size="33" font-weight="600" fill="#224c7c">4  标准发布，新版本生效</text>
    <text x="94" y="962" font-size="26" fill="#516b89">系统保存发布记录，并保留历史版本</text>
    <rect x="64" y="1080" width="672" height="166" rx="14" fill="#eff6ff" stroke="#bfd5ef" stroke-width="2"/>
    <text x="94" y="1136" font-size="33" font-weight="600" fill="#224c7c">5  完整标准发布到企业微信群</text>
    <text x="94" y="1180" font-size="26" fill="#516b89">包含全部参数、版本及审核信息</text>
    <text x="94" y="1219" font-size="28" font-weight="600" fill="#224c7c">@所有人，请相关人员按标准执行</text>
    <rect x="784" y="610" width="234" height="150" rx="14" fill="#fffbeb" stroke="#e9d8ac" stroke-width="2"/>
    <text x="810" y="661" font-size="31" font-weight="600" fill="#88601e">驳回修改</text>
    <text x="810" y="704" font-size="25" fill="#926f33">填写驳回原因</text><text x="810" y="740" font-size="25" fill="#926f33">退回草稿</text>
    <g fill="none" stroke="#b7791f" stroke-width="3" marker-end="url(#return)"><path d="M738 684H773"/><path d="M902 608V263H753"/></g>
    <text x="792" y="570" font-size="25" fill="#926f33">修改后重新提交</text>
    <rect x="64" y="1300" width="954" height="168" rx="12" fill="#f8fafc"/>
    <g font-size="24" fill="#64748b">
      <text x="88" y="1342">权限：具备提交权限的人员可新增、修改并提交。</text>
      <text x="88" y="1378">管理员：可直接保存发布，无需审核。</text>
      <text x="88" y="1414">群公告内容较多时分条发布；发送异常时请先核查群记录。</text>
      <text x="88" y="1450">生产执行以系统中的当前已发布版本为准。</text>
    </g>
  </g>
</svg>
