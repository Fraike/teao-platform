name: Deploy to Server

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '输入 release 确认发布代码；不执行数据迁移'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: teao-platform-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - run: npm ci --prefix server

      - run: npm run lint

      - run: npm test

      - run: node --test test/release-safety.test.js test/sanitary-migration-cli.test.js

      - run: npm run build

      - name: Package reviewed release (no runtime data)
        run: |
          node server/scripts/release-package.js "$GITHUB_WORKSPACE" "$RUNNER_TEMP/teao-release"
          mkdir -p release-upload
          tar -czf release-upload/release.tar.gz -C "$RUNNER_TEMP/teao-release" .

      - name: Stage and release static + API together
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ARGS: "-rlgoDz -i"
          REMOTE_HOST: 8.134.18.9
          REMOTE_USER: root
          SOURCE: "release-upload/"
          TARGET: "/var/lib/teao-platform/incoming/${{ github.run_id }}-${{ github.run_attempt }}/"
          SCRIPT_AFTER: |
            set -eu
            stage=/var/lib/teao-platform/incoming/${{ github.run_id }}-${{ github.run_attempt }}/stage
            mkdir -m 700 "$stage"
            tar --no-same-owner --no-same-permissions -xzf "$(dirname "$stage")/release.tar.gz" -C "$stage"
            test "$(/usr/bin/node -p 'process.versions.node.split(".")[0]')" = 24
            /usr/bin/node "$stage/server/scripts/release-deploy.js" --stage "$stage" > "$(dirname "$stage")/preview.json"
            fingerprint=$(/usr/bin/node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1])).fingerprint)' "$(dirname "$stage")/preview.json")
            /usr/bin/node "$stage/server/scripts/release-deploy.js" --stage "$stage" --apply --confirm "$fingerprint"
