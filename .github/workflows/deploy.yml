name: Deploy to Server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teao-platform-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - run: npm ci --prefix server

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: Deploy static files
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ARGS: "-rlgoDzvc -i"
          EXCLUDE: "/data/, /server/"
          REMOTE_HOST: 8.134.18.9
          REMOTE_USER: root
          SOURCE: "dist/"
          TARGET: "/var/www/teao-platform/"

      - name: Deploy API server
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ARGS: "-rlgoDzvc -i"
          EXCLUDE: "production-config.json, .env, .env.*, node_modules/"
          REMOTE_HOST: 8.134.18.9
          REMOTE_USER: root
          SOURCE: "server/"
          TARGET: "/var/www/teao-platform/server/"
          SCRIPT_AFTER: |
            install -d -m 700 /etc/teao-platform
            test -s /etc/teao-platform/teao-api.env
            chmod 600 /etc/teao-platform/teao-api.env
            for key in JWT_SECRET DATA_DIR KINGDEE_CLIENT_ID KINGDEE_CLIENT_SECRET INITIAL_ADMIN_PASSWORD ADMIN_RECOVERY_CODE; do
              grep -q "^${key}=." /etc/teao-platform/teao-api.env
            done
            cd /var/www/teao-platform/server && npm install --production
            cp -f /var/www/teao-platform/server/teao-api.service /etc/systemd/system/teao-api.service
            systemctl daemon-reload
            systemctl enable teao-api
            systemctl restart teao-api
            # Gzip compression
            cat > /etc/nginx/conf.d/gzip.conf << 'GZIP'
            gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;
            gzip_vary on;
            gzip_comp_level 5;
            gzip_min_length 1000;
            gzip_proxied any;
            GZIP
            # Setup nginx proxy if not already configured
            grep -q "location /api/" /etc/nginx/sites-available/teao-platform || {
              sed -i 's|location / {|location /api/ {\n        proxy_pass http://127.0.0.1:3899;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n    }\n    location / {|' /etc/nginx/sites-available/teao-platform
            }
            nginx -t && systemctl reload nginx
